<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 600" width="1070" height="600" role="img" aria-labelledby="t d">
<title id="t">KitchenBot architecture overview</title>
<desc id="d">Customers message over WhatsApp to the bridge, which hands each conversation to an LLM agent whose internals are intentionally omitted. The agent talks to the kitchen API, which feeds print jobs to the Android printer app. Speech packages, an admin interface, a mock kitchen API and a voice evaluation harness sit around this flow; boxes with a green border are published in this repository.</desc>
<style>
  .bg{fill:#f6f8fa;stroke:#d0d7de}
  .ttl{font:700 20px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#1f2328}
  .lbl{font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#1f2328}
  .sub,.alb,.leg{font:12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#57606a}
  .alb{font-style:italic}
  .repo{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
  .priv{fill:#ffffff;stroke:#6e7781;stroke-width:1.5;stroke-dasharray:6 4}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
  .arr{stroke:#57606a;stroke-width:1.8;fill:none}
  .dash{stroke-dasharray:5 4}
  .ah{fill:#57606a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
