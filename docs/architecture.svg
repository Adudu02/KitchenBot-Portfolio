<text class="lbl" x="325.0" y="150" text-anchor="middle">whatsapp-manager</text>
<text class="sub" x="325.0" y="170" text-anchor="middle">bridge + WhatsApp transport</text>
<rect class="priv" x="450" y="120" width="170" height="76" rx="8"/>
<text class="lbl" x="535.0" y="150" text-anchor="middle">LLM agent with tools</text>
